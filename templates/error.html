{% extends "base.html" %}
{% block title %}{{ title or "Ошибка" }} — ResearchLens{% endblock %}
{% block content %}
<section class="empty empty--page">
  <h1>{{ title or "Что-то пошло не так" }}</h1>
  <p>{{ message }}</p>
  {% if query %}
    <p><a class="btn btn-primary" href="{{ url_for('search', q=query) }}">Повторить поиск</a></p>
  {% else %}
    <p><a class="btn btn-primary" href="{{ url_for('index') }}">К поиску</a></p>
  {% endif %}
</section>
{% endblock %}
